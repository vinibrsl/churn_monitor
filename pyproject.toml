[project]
name = "churn_monitor"
version = "0.1.0"
description = "churn_monitor using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.4.1",
    "jambo>=0.1.3.post2",
    "pydantic>=2.12.4",
    "toon-format",
]

[project.scripts]
kickoff = "churn_monitor.main:kickoff"
run_crew = "churn_monitor.main:kickoff"
plot = "churn_monitor.main:plot"
run_with_trigger = "churn_monitor.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"

[tool.uv.sources]
toon-format = { git = "https://github.com/toon-format/toon-python.git" }
