---
develop_retention_strategy:
  description: |-
    Look at this customer's data and answer these questions:

    1. What is the ONE biggest problem causing this customer pain right now?
    2. What SPECIFIC, CONCRETE action are we committing to THIS WEEK to fix it?
    3. What business impact are we preventing for them?

    CRITICAL RULES:
    - The action must be SPECIFIC (not "audit" or "investigate")
    - We must be COMMITTING to do something, not proposing to discuss it
    - Show you understand the business impact, not just the technical issue
    - If it's a bug/issue: commit to a fix timeline
    - If it's a feature gap: commit to a workaround or roadmap clarity
    - If it's poor support: commit to escalation or direct engineer access

    Account information:
    {account_information}

    Churn report:
    {churn_report}

  expected_output: |-
    A brief, focused strategy (3-5 sentences max) that includes:
      - The ONE core problem with BUSINESS IMPACT (not just technical symptoms)
      - The SPECIFIC commitment we're making (with timeline/deliverable)
      - Why this matters to THEIR business specifically

    Example GOOD output:
    "Their tracking page breaks during peak shipping hours (Ticket T5103) and they're
    a logistics company where every tracking failure loses them customers. We're
    committing our backend team to ship a fix by Friday that adds failover routing
    during high load. They care about 99.9% uptime during business hours, not explanations."

    Example BAD output:
    "Dashboard is slow. We should run a performance audit and schedule a meeting
    to discuss findings."

    DO NOT write: vague actions like "audit," "investigate," "discuss," or "review."
    DO write: specific deliverables like "ship a fix by Friday," "add engineer to
    their Slack channel today," "implement caching layer this week."
  agent: customer_retention_strategist
draft_personalized_outreach_email:
  description: |-
    Write a short, strategic email that shows you're ALREADY taking action, not just
    proposing to discuss the problem.

    CRITICAL RULES:
    - Keep it under 100 words (aim for 50-75)
    - Lead with the SPECIFIC ACTION you're committing to (not "let's meet to discuss")
    - Show you understand the BUSINESS IMPACT (not just the technical issue)
    - Be direct and confident—you're solving this, not investigating it
    - No vague words: "audit," "review," "discuss," "touch base," "circle back"
    - A meeting/call can be SECONDARY to confirm details, but the primary message
      must be the concrete action you're taking

    STRUCTURE:
    1. Acknowledge the specific problem with context
    2. State the CONCRETE action you're committing to (with timeline)
    3. Optional: propose a brief call to confirm details or share updates
    4. Keep tone confident but warm

    Account information:
    {account_information}

  expected_output: |-
    A short, strategic email (50-75 words) with a list of actionable commitments:

    EMAIL FORMAT:
    - Subject line: action-oriented (e.g., "Fixing your tracking page by Friday")
    - Greeting: use their first name
    - Body: 2-3 sentences that:
      * Acknowledge specific problem + business impact
      * State the concrete commitment with timeline
      * (Optional) Suggest brief touchpoint to share progress
    - Sign off: simple and confident

    COMMITMENTS LIST:
    - Extract ONLY the specific, actionable promises made in the email
    - Must include deliverables with deadlines
    - Must be measurable and trackable

    Example GOOD email (bug fix):
    Subject: Fixing your tracking page by Friday

    "Hi Raj, I know your tracking page has been failing during peak hours and that's
    directly impacting your customers. Our backend team is shipping a fix by Friday
    that adds failover routing during high load. I'll send you the deployment notes
    Friday afternoon—let me know if you want to jump on a quick call to review them.
    Thanks, Sarah"

    Example commitments:
    - "Ship tracking page fix with failover routing by Friday"
    - "Send deployment notes Friday afternoon"

    Example GOOD email (support escalation):
    Subject: Getting you direct access to our engineering team

    "Hi Marcus, I saw you've been bounced between support reps on the API timeout
    issue (T5201, T5289). That ends today—I'm adding you directly to our backend
    team's Slack channel so you can work with the engineers fixing this. You should
    have the invite within the hour. Thanks, Alex"

    Example commitments:
    - "Add customer to backend team Slack channel within one hour"
    - "Ensure direct engineer access for API timeout issue"

    Example BAD email (too vague):
    "Hi Bret, I noticed the slow dashboard has been a concern. We're going to run
    a performance audit this week. Could we touch base on Friday to discuss findings?"

    Why BAD: "performance audit" is vague, "discuss findings" delays action, no
    business impact acknowledged, no concrete deliverable

    AVOID: "audit," "investigate," "review," "touch base," "circle back," "let's discuss"
    USE: "shipping," "fixing," "adding," "implementing," "deploying," with deadlines
  agent: email_outreach_specialist
  context:
  - develop_retention_strategy
