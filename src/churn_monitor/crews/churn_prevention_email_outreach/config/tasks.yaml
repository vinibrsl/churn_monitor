---
develop_retention_strategy:
  description: |-
    Look at this customer's data and answer these questions:

    1. What is the ONE biggest problem causing this customer pain right now?
    2. What concrete action can we take THIS WEEK to fix it?
    3. What should we say to them that shows we actually understand their situation?

    Don't create a comprehensive strategy document. Just identify the core issue
    and the fix. Be specific. Be brief.

    Account information:
    {account_information}

    Churn report:
    {churn_report}

  expected_output: |-
    A brief, focused strategy (3-5 sentences max) that includes:
      - The ONE core problem (be specific, not generic)
      - The concrete action we'll take to fix it (must be actionable this week)
      - What this customer actually cares about (not generic "success metrics")

    Example good output:
    "Their tracking page has been broken for weeks (Ticket T5103) and they keep
    getting generic responses. They're a logistics company—tracking IS their business.
    We need to get an engineer on a call with them THIS WEEK to fix it permanently,
    not just ticket it. They care about reliability, not apologies."

    DO NOT write: risk assessments, comprehensive plans, backup strategies, or
    multi-phase implementation timelines. Just the core problem and the fix.
  agent: customer_retention_strategist
draft_personalized_outreach_email:
  description: |-
    Write a short, human email to this customer based on the retention strategy.

    Rules:
    - Keep it under 100 words (aim for 50-75)
    - Write like a real person, not a corporate robot
    - Focus ONLY on the one core problem identified in the strategy
    - No generic phrases like "I hope this finds you well" or "strategic partnership"
    - No bullet points or formatted lists—just natural sentences
    - One clear next step (a call, a meeting, a specific action)
    - Be honest and direct

    Account information:
    {account_information}

  expected_output: |-
    A short, natural email (50-75 words) with a list of actionable commitments:

    EMAIL FORMAT:
    - Subject line: specific and relevant (e.g., "Fix for the tracking page issue")
    - Greeting: use their first name
    - Body: 2-3 short sentences acknowledging the specific problem and proposing the fix
    - Call to action: one clear next step (e.g., "Can we get on a call Thursday?")
    - Sign off: simple and warm (e.g., "Thanks, [Name]")

    COMMITMENTS LIST:
    - Extract ONLY the specific, actionable promises made in the email
    - Must be things the sender can actually track and fulfill
    - Include deadlines/timeframes mentioned (e.g., "this week", "Thursday")
    - Keep each commitment as a single, clear action item

    Example email:
    "Hi Raj, I saw the tracking page has been causing issues for your team. I'd
    like to get one of our engineers on a call with you this week to fix it
    properly—not just patch it. Does Thursday at 2pm work? Thanks, Sarah"

    Example commitments for above email:
    - "Schedule engineer call with customer by Thursday at 2pm"
    - "Provide permanent fix for tracking page issue (not just a patch)"

    AVOID IN EMAIL: long paragraphs, corporate language, listing multiple issues,
    vague promises, generic statements about "commitment to excellence"

    AVOID IN COMMITMENTS: vague items like "provide excellent service" or
    "ensure customer satisfaction"—only concrete, measurable actions
  agent: email_outreach_specialist
  context:
  - develop_retention_strategy
