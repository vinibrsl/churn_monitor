---
analyze_support_tickets:
  description: |-
    Look through the support tickets for account {account_id} and find the answer to ONE question:

    What is the ONE issue that keeps coming up that's clearly frustrating this customer?

    Look for:
    - Same problem reported multiple times (even if worded differently)
    - Increasing frustration in their messages
    - Long resolution times or issues marked resolved but reopened
    - Problems that directly impact their core business

    Ignore one-off questions or minor issues. What's the PATTERN that matters?

    Input data format: {support_tickets_data}
    Additional context: {additional_data}
  expected_output: |-
    A brief analysis (3-5 sentences) that answers:

    1. What is the core recurring problem? (Be specific: "tracking page errors" not "technical issues")
    2. How many times has it come up and over what period?
    3. What's the customer's tone about it? (frustrated, angry, or still patient?)
    4. Has it been actually fixed or just patched over?

    Example: "The tracking page has been broken for 3 weeks (Tickets T5103, T5201, T5289).
    Customer is clearly frustrated—their last message said 'this is unacceptable for our business.'
    Each time support has said 'we'll look into it' but there's no evidence of a real fix."

    DO NOT write: comprehensive reports, ticket metrics tables, or category breakdowns.
  agent: support_ticket_data_analyst
analyze_account_profile:
  description: |-
    Look at account {account_id}'s profile and answer: Is there anything about THIS
    customer that makes their problems more urgent?

    Check for:
    - Contract renewal coming up soon (within 3 months = urgent)
    - High revenue account (over $50k/year = important)
    - Industry where this problem is critical (e.g., logistics company with tracking issues)
    - Recent reduction in engagement or usage

    Don't force urgency if it's not there. If they're a low-revenue account with 18 months
    left on contract, just say that.

    Input data format: {account_data}
    Additional context: {additional_data}
  expected_output: |-
    A brief context assessment (2-3 sentences) covering:

    1. Is there timing pressure? (contract renewal soon?)
    2. Is this a high-value account? (revenue amount)
    3. Does their industry/business make this problem more critical?

    Example 1 (urgent): "FedEx is a $150k/year account with contract renewal in 6 weeks.
    They're a logistics company, so tracking reliability is existential for them."

    Example 2 (not urgent): "Small account ($12k/year) with renewal 14 months away.
    Standard SaaS customer, no special industry considerations."

    DO NOT write: comprehensive profiles, health scores, or engagement metrics tables.
  agent: account_profile_analyzer
classify_churn_risk:
  description: |-
    You've got the ticket analysis and account context. Now make the call: How serious is this?

    Decision framework:
    - **HIGH**: Serious unresolved problem + (high value OR renewal soon OR very frustrated customer)
    - **MEDIUM**: Recurring problem but not urgent, OR frustrated customer but low stakes
    - **LOW**: Minor issues only, happy customer, or problems already being fixed

    Be honest. Don't upgrade to HIGH just because you can. But don't downplay real problems either.

  expected_output: |-
    A concise risk assessment that includes:

    1. **Risk Level**: HIGH, MEDIUM, or LOW (pick one)
    2. **Risk Score**: 1-10 number
    3. **One-Sentence Reason**: Why this rating? What's the core issue?
    4. **Recommended Action**: What should we do THIS WEEK? (one specific action)
    5. **Supporting Evidence**: 1-2 specific data points (ticket IDs, revenue, dates)

    Example HIGH:
    "HIGH risk (9/10). Tracking page has been broken for 3 weeks with no real fix (T5103, T5201),
    customer is frustrated, and they're a $150k logistics account renewing in 6 weeks. Get an
    engineer on a call THIS WEEK to fix it permanently."

    Example MEDIUM:
    "MEDIUM risk (5/10). Slow API responses reported twice (T4522, T4801). Customer is patient
    but it's affecting their workflows. Mid-size account ($45k) with 8 months to renewal. Schedule
    performance review call next week."

    Example LOW:
    "LOW risk (2/10). One minor UI bug (T3331) already fixed. Happy customer, no patterns of concern.
    Standard check-in next quarter is fine."

    DO NOT write: comprehensive reports, multi-factor breakdowns, or lengthy action plans.
  agent: churn_risk_classifier
  context:
  - analyze_support_tickets
  - analyze_account_profile
